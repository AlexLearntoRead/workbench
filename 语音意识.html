<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音素意识训练工具</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
        --blue: #2B7FD8;
        --blue-dark: #1a5fb0;
        --red: #ff5c5c;
        --red-dark: #e64545;
        --green: #5cb85c;
        --yellow: #f0ad4e;
        --purple: #9b59b6;
        --ink: #1f2937;
        --ink-soft: #64748b;
        --bg: #ffffff;
        --panel: #e8f4fc;
    }
    body {
        font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
    }

    /* 顶部标题栏 */
    header {
        position: sticky; top: 0; z-index: 100;
        background: rgba(255,255,255,.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 10px rgba(30,41,59,.06);
        padding: 12px 26px;
    }
    .header-inner {
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 10px;
    }
    header h1 {
        font-size: 24px; font-weight: 800;
        background: linear-gradient(90deg, var(--blue), var(--red));
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .back-btn {
        font-size: 14px; font-weight: 600; color: var(--ink-soft);
        background: rgba(255,255,255,.6); border: 1px solid #d3dbe3;
        border-radius: 9px; padding: 6px 14px; cursor: pointer;
        transition: all .15s;
    }
    .back-btn:hover { background: #fff; border-color: var(--blue); color: var(--blue); }

    /* 主内容区 */
    main {
        max-width: 1400px; margin: 0 auto;
        padding: 24px;
    }

    /* 层级选择页 */
    .level-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin-top: 20px;
    }
    .level-card {
        background: var(--panel);
        border-radius: 16px;
        padding: 24px;
        cursor: pointer;
        transition: all .2s;
        border: 2px solid transparent;
    }
    .level-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0,0,0,.1);
    }
    .level-card.word-level { border-left: 6px solid var(--blue); }
    .level-card.syllable-level { border-left: 6px solid var(--green); }
    .level-card.phoneme-level { border-left: 6px solid var(--red); }
    .level-icon {
        font-size: 48px; margin-bottom: 12px;
    }
    .level-title {
        font-size: 22px; font-weight: 800; margin-bottom: 8px;
    }
    .level-desc {
        font-size: 14px; color: var(--ink-soft); margin-bottom: 16px;
        line-height: 1.6;
    }
    .level-count {
        font-size: 13px; font-weight: 600;
        padding: 4px 10px; border-radius: 999px;
        display: inline-block;
    }
    .word-level .level-count { background: rgba(74,159,212,.15); color: var(--blue); }
    .syllable-level .level-count { background: rgba(92,184,92,.15); color: var(--green); }
    .phoneme-level .level-count { background: rgba(255,92,92,.15); color: var(--red); }

    /* 训练项目列表页 */
    .exercise-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 20px;
    }
    .exercise-card {
        background: #fff;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        cursor: pointer;
        transition: all .15s;
    }
    .exercise-card:hover {
        border-color: var(--blue);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .exercise-num {
        font-size: 12px; font-weight: 700; color: var(--ink-soft);
        margin-bottom: 8px;
    }
    .exercise-title {
        font-size: 18px; font-weight: 700; margin-bottom: 8px;
    }
    .exercise-desc {
        font-size: 13px; color: var(--ink-soft); line-height: 1.5;
    }

    /* 训练界面 */
    .training-area {
        background: var(--panel);
        border-radius: 16px;
        padding: 32px;
        margin-top: 20px;
        min-height: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .training-title {
        font-size: 20px; font-weight: 700; margin-bottom: 24px;
        text-align: center;
    }
    .play-sound-btn {
        font-size: 18px; font-weight: 600;
        background: var(--blue); color: #fff;
        border: none; border-radius: 12px;
        padding: 16px 32px; cursor: pointer;
        transition: all .15s;
        margin-bottom: 24px;
    }
    .play-sound-btn:hover { background: var(--blue-dark); transform: translateY(-2px); }
    .options-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        width: 100%;
        max-width: 600px;
    }
    .option-btn {
        font-size: 24px; font-weight: 700;
        background: #fff; color: var(--ink);
        border: 3px solid #e2e8f0; border-radius: 12px;
        padding: 24px; cursor: pointer;
        transition: all .15s;
        text-align: center;
    }
    .option-btn:hover { border-color: var(--blue); background: rgba(74,159,212,.05); }
    .option-btn.correct { border-color: var(--green); background: rgba(92,184,92,.1); }
    .option-btn.wrong { border-color: var(--red); background: rgba(255,92,92,.1); }

    .progress-bar {
        width: 100%; max-width: 600px;
        height: 8px; background: #e2e8f0;
        border-radius: 4px; margin-bottom: 24px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%; background: linear-gradient(90deg, var(--blue), var(--green));
        border-radius: 4px;
        transition: width .3s;
    }
    .score-display {
        font-size: 16px; font-weight: 600; color: var(--ink-soft);
        margin-bottom: 16px;
    }

    /* 占位提示 */
    .placeholder {
        text-align: center;
        padding: 60px 20px;
    }
    .placeholder-icon {
        font-size: 64px; margin-bottom: 16px;
    }
    .placeholder-text {
        font-size: 18px; color: var(--ink-soft);
        line-height: 1.6;
    }

    @media (max-width: 900px) {
        .level-grid { grid-template-columns: 1fr; }
        .options-grid { grid-template-columns: 1fr; }
    }

/* 返回按钮 */
.back-to-workbench{
  position:fixed;bottom:12px;right:12px;z-index:9999;
  padding:6px 14px;background:#fff;
  border:2px solid #2B7FD8;border-radius:14px;
  font-size:12px;font-weight:700;color:#2B7FD8;
  cursor:pointer;font-family:inherit;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  transition:all .2s;text-decoration:none;
}
.back-to-workbench:hover{
  background:#2B7FD8;color:#fff;
}

</style>


<style>
/* ===== v2.0 统一设计语言（Alex 工作台品牌） ===== */
.wb-topbar{position:sticky;top:0;z-index:99999;display:flex;align-items:center;gap:14px;background:rgba(254,252,246,.97);border-bottom:1px solid #eee7d8;padding:9px clamp(12px,3vw,26px);box-sizing:border-box;}
.wb-topbar::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,#2B7FD8,#F4D758,#E84A5F);}
.wb-back{flex:none;display:inline-flex;align-items:center;gap:5px;background:rgba(43,127,216,.08);color:#1a5fb0;border:1px solid rgba(43,127,216,.28);border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:600;text-decoration:none;font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;line-height:1.4;}
.wb-back:hover{background:rgba(43,127,216,.18);}
.wb-title{display:flex;align-items:baseline;gap:10px;min-width:0;}
.wb-title b{font-size:1rem;font-weight:700;color:#1A1A2E;white-space:nowrap;}
.wb-title i{font-style:normal;font-size:.72rem;color:#5a5a72;font-family:Georgia,'Times New Roman',serif;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
body{background:#fefcf6!important;}
.back-to-workbench,.back-btn{display:none!important;}
@media(max-width:560px){.wb-title b{font-size:.92rem;}.wb-title i{display:none;}.wb-topbar{gap:10px;padding:8px 10px;}}

</style>

<style>
/* ===== v4.0 游戏化：泡泡题型 / 反馈动画 / 星星进度 ===== */
/* 泡泡选项 */
.options-grid.bubble-mode{max-width:640px;}
.bubble-mode .option-btn{
  border-radius:50%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 28%, #fff, #eaf3fe);
  border:4px solid rgba(43,127,216,.35);
  font-size:22px;font-weight:800;color:#1a5fb0;
  box-shadow:0 6px 16px rgba(43,127,216,.16), inset 0 -3px 0 rgba(43,127,216,.10);
  transition:transform .15s, box-shadow .15s, border-color .15s;
  animation:bubble-float 3s ease-in-out infinite;
}
.bubble-mode .option-btn:nth-child(2){animation-delay:.4s;}
.bubble-mode .option-btn:nth-child(3){animation-delay:.8s;}
.bubble-mode .option-btn:nth-child(4){animation-delay:1.2s;}
.bubble-mode .option-btn:hover{transform:translateY(-4px) scale(1.04);border-color:var(--blue);}
.bubble-mode .option-btn.correct{background:radial-gradient(circle at 32% 28%, #eafff2, #b8f0cd);border-color:#10b981;color:#047857;animation:none;transform:scale(1.12);box-shadow:0 0 0 6px rgba(16,185,129,.2), 0 8px 20px rgba(16,185,129,.3);}
.bubble-mode .option-btn.wrong{background:radial-gradient(circle at 32% 28%, #fff1f1, #ffd9d9);border-color:#ef4444;color:#b91c1c;animation:wobble .5s ease;box-shadow:0 0 0 5px rgba(239,68,68,.18);}
@keyframes bubble-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop-in{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes star-pop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.4) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

/* 普通选项也圆润 */
.option-btn{border-radius:16px;transition:transform .12s, border-color .15s, background .15s;}
.option-btn:not(:disabled):active{transform:scale(.96);}

/* 反馈条 */
.feedback-bar{
  width:100%;max-width:600px;min-height:46px;border-radius:12px;
  display:none;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:700;margin-bottom:16px;padding:10px 16px;text-align:center;
}
.feedback-bar.show{display:flex;animation:pop-in .3s ease;}
.feedback-bar.fb-right{background:rgba(16,185,129,.12);color:#047857;border:2px solid rgba(16,185,129,.35);}
.feedback-bar.fb-wrong{background:rgba(239,68,68,.10);color:#b91c1c;border:2px solid rgba(239,68,68,.30);}
.feedback-bar .fb-star{font-size:20px;animation:star-pop .5s ease;}

/* 星星行 */
.star-row{display:flex;gap:6px;justify-content:center;margin-bottom:14px;min-height:34px;}
.star-row .star{font-size:30px;opacity:.22;filter:grayscale(1);}
.star-row .star.on{opacity:1;filter:none;animation:star-pop .5s ease;}

/* 层级进度 */
.level-progress{height:8px;background:rgba(30,41,59,.08);border-radius:4px;overflow:hidden;margin-top:14px;}
.level-progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#5CA8E8,#2B7FD8);transition:width .5s ease;width:0;}
.level-card .level-badge{
  display:none;margin-top:10px;font-size:13px;font-weight:800;color:#8a5a00;
  background:linear-gradient(90deg,rgba(244,215,88,.55),rgba(244,215,88,.35));
  border:1px solid rgba(224,181,18,.5);border-radius:999px;padding:5px 12px;text-align:center;
}
.level-card.unlocked .level-badge{display:block;}
.level-card .level-stars{font-size:13px;font-weight:700;color:#8a5a00;margin-left:8px;}

/* 练习卡片完成标记 */
.exercise-card.done{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.05);}
.exercise-card.done .exercise-num::after{content:' ✓ 已完成';color:#047857;font-weight:700;}

/* 完成页 */
.complete-box{text-align:center;padding:20px;}
.complete-box .complete-emoji{font-size:56px;margin-bottom:10px;animation:pop-in .5s ease;}
.complete-box .complete-title{font-size:22px;font-weight:800;margin-bottom:8px;}
.complete-box .complete-sub{font-size:15px;color:var(--ink-soft);margin-bottom:16px;}
.complete-box .complete-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* 自动发音提示 */
.listen-hint{font-size:13px;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.listen-hint .pulse-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
/* ===== v4.1 纯听辨版：选项=发音按钮（不显示英文单词） ===== */
.q-sound{display:flex;align-items:center;gap:12px;justify-content:center;margin:4px 0 14px;flex-wrap:wrap;}
.q-play-btn{width:64px;height:64px;border-radius:50%;border:3px solid rgba(43,127,216,.4);background:linear-gradient(145deg,#f3f9ff,#dcecfb);font-size:26px;cursor:pointer;flex:none;box-shadow:0 4px 12px rgba(43,127,216,.2);transition:transform .12s;}
.q-play-btn:active{transform:scale(.92);}
.q-emoji{font-size:44px;line-height:1;}
.q-prompt{font-size:16px;font-weight:800;color:#1a5fb0;background:rgba(43,127,216,.08);border:1px solid rgba(43,127,216,.2);border-radius:12px;padding:8px 14px;}
.option-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:108px;padding:14px 10px;cursor:pointer;}
.opt-emoji{font-size:36px;line-height:1;}
.opt-cn{font-size:14px;font-weight:700;color:#3a3f47;}
.opt-sound-badge{position:absolute;top:8px;right:10px;font-size:13px;color:#1a5fb0;background:rgba(43,127,216,.12);border-radius:999px;padding:3px 7px;}
.option-btn.selected{outline:3px solid #2B7FD8;outline-offset:2px;background:#ffffff;transform:scale(1.04);box-shadow:0 6px 18px rgba(43,127,216,.25);}
.option-btn.selected::after{content:'再点一次确认';position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#1a5fb0;white-space:nowrap;background:#e8f2fc;border-radius:999px;padding:2px 8px;}
.options-grid{margin-bottom:34px;}
/* 泡泡模式适配听辨版（圆形放 emoji+中文） */
.bubble-mode .option-btn{border-radius:50%;min-height:0;aspect-ratio:1/1;padding:8px;}
.bubble-mode .opt-emoji{font-size:40px;}
.bubble-mode .opt-cn{font-size:12px;}
.bubble-mode .opt-sound-badge{top:6px;right:6px;font-size:11px;padding:2px 5px;}
.bubble-mode .option-btn.selected::after{bottom:-16px;}
/* ===== v6.0 布局修复 + 游戏化 ===== */
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:600px;width:100%;margin:0 auto 10px;}
.combo-display{min-height:32px;font-size:17px;font-weight:800;color:#e84a5f;letter-spacing:1px;}
.combo-display.big{animation:combo-pop .35s ease;}
@keyframes combo-pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
/* 题目卡独立成行（不再占用选项网格） */
#q-sound-holder{max-width:600px;width:100%;margin:0 auto 16px;}
.q-sound{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(43,127,216,.08),rgba(244,215,88,.12));
  border:2px solid rgba(43,127,216,.22);border-radius:20px;padding:16px 18px;box-sizing:border-box;}
.q-play-btn{width:64px;height:64px;border-radius:50%;border:3px solid rgba(43,127,216,.4);background:linear-gradient(145deg,#f3f9ff,#dcecfb);font-size:26px;cursor:pointer;flex:none;box-shadow:0 4px 12px rgba(43,127,216,.2);transition:transform .12s;}
.q-play-btn:active{transform:scale(.92);}
.q-emoji{font-size:44px;line-height:1;}
.q-prompt{font-size:16px;font-weight:800;color:#1a5fb0;}
/* 选项网格：固定 2 列，顺序从左到右 */
.options-grid{max-width:600px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.option-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:112px;padding:14px 10px;cursor:pointer;border-radius:18px;box-sizing:border-box;}
.opt-emoji{font-size:38px;line-height:1;}
.opt-cn{font-size:15px;font-weight:700;color:#3a3f47;}
.opt-sound-badge{position:absolute;top:8px;right:12px;font-size:13px;color:#1a5fb0;background:rgba(43,127,216,.12);border-radius:999px;padding:3px 7px;}
.option-btn.selected{outline:3px solid #2B7FD8;outline-offset:2px;background:#ffffff;transform:scale(1.04);box-shadow:0 6px 18px rgba(43,127,216,.25);}
.option-btn.selected::after{content:'再点一次确认';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#1a5fb0;white-space:nowrap;background:#e8f2fc;border-radius:999px;padding:2px 8px;}
.bubble-mode .option-btn{border-radius:50%;min-height:0;aspect-ratio:1/1;padding:10px;}
.bubble-mode .opt-emoji{font-size:44px;}
.bubble-mode .opt-cn{font-size:13px;}
/* 反馈条移到选项下方 */
.feedback-bar{max-width:600px;width:100%;margin:0 auto 14px;}
/* 星星雨 */
.star-rain{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.star-rain .rain-star{position:absolute;top:-40px;font-size:26px;animation:rain-fall linear forwards;}
@keyframes rain-fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:.6}}
/* 答对按钮粒子 */
.option-btn.correct::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 60%);animation:correct-flash .6s ease;}
@keyframes correct-flash{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.4)}}
/* 得分弹跳 */
.score-display{font-size:16px;font-weight:800;color:#1a5fb0;}
.score-display.bump{animation:bump .3s ease;}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

/* 一屏显示紧凑模式 */
body{overflow-y:auto;margin:0;padding:0}
header{padding:6px 16px!important;margin:0!important}
header h1{font-size:17px!important;margin:0!important;line-height:1.2!important}
header p{font-size:10px!important;margin:1px 0 0 0!important;line-height:1.2!important}
.nav-tabs{padding:3px 16px!important;gap:3px!important;margin:0!important}
.nav-tab{padding:3px 10px!important;font-size:11px!important;border-radius:5px!important}
main{padding:6px 16px!important;margin:0!important}
.module-grid{gap:8px!important;padding:4px 0!important}
.module-card{padding:10px 12px!important;min-height:0!important;height:auto!important}
.module-icon{font-size:24px!important;margin-bottom:4px!important}
.module-title{font-size:13px!important;margin:2px 0!important}
.module-desc{font-size:10px!important;line-height:1.3!important;margin:0!important}

.level-grid{gap:8px!important;padding:4px 0!important}
.level-card{padding:10px 12px!important;min-height:0!important;height:auto!important}
.level-card h3{font-size:13px!important;margin:2px 0!important}
.level-card .level-desc{font-size:10px!important;margin:2px 0!important;line-height:1.3!important}
.level-count{font-size:11px!important;margin:2px 0!important}
.level-card .level-icon{font-size:28px!important;margin-bottom:4px!important}
</style>

</head>

<div class="wb-topbar"><a href="javascript:void(0)" class="wb-back" id="wb-back">← 返回</a><div class="wb-title"><b>🎧 语音意识</b><i>Phonological Awareness</i></div></div>

<header>
    <div class="header-inner">
        <h1 id="page-title">音素意识训练工具</h1>
        <button class="back-btn" id="back-btn" hidden>← 返回</button>
    </div>
</header>

<main>
    <!-- 层级选择页 -->
    <div id="level-page">
        <div class="level-grid">
            <div class="level-card word-level" data-level="word">
                <div class="level-icon">📝</div>

// ===== 进度存档 =====
const PROG_KEY = 'alex_pa_progress_v1';
let progress = { done: {}, stars: 0, master: {}, totalScore: 0, bestCombo: 0 };
try {
    const saved = JSON.parse(localStorage.getItem(PROG_KEY) || 'null');
    if (saved) progress = saved;
    if (typeof progress.totalScore !== 'number') progress.totalScore = 0;
    if (typeof progress.bestCombo !== 'number') progress.bestCombo = 0;
} catch (e) {}

function saveProgress() {
    try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {}
}

// ===== 音效（WebAudio 合成，无需音频文件） =====
let actx = null;
function getCtx() {
    try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        return actx;
    } catch (e) { return null; }
}
function tone(freq, dur, when, type, vol) {
    const ctx = getCtx();
    if (!ctx) return;
    try {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        const t0 = ctx.currentTime + (when || 0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
}
function sfxClick() { tone(520, 0.07, 0, 'sine', 0.12); }
function sfxRight() { tone(660, 0.12, 0, 'sine', 0.18); tone(880, 0.16, 0.1, 'sine', 0.18); }
function sfxCombo() { tone(660, 0.1, 0, 'sine', 0.16); tone(880, 0.1, 0.09, 'sine', 0.16); tone(1100, 0.18, 0.18, 'sine', 0.16); }
function sfxWrong() { tone(220, 0.22, 0, 'sawtooth', 0.12); }
function sfxWin() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, i * 0.12, 'sine', 0.18)); }

// DOM元素
const levelPage = document.getElementById('level-page');
const exercisePage = document.getElementById('exercise-page');
const trainingPage = document.getElementById('training-page');
const backBtn = document.getElementById('back-btn');
const wbBack = document.getElementById('wb-back');
const pageTitle = document.getElementById('page-title');
const exerciseList = document.getElementById('exercise-list');
const trainingTitle = document.getElementById('training-title');
const playSoundBtn = document.getElementById('play-sound-btn');
const optionsGrid = document.getElementById('options-grid');
const scoreDisplay = document.getElementById('score-display');
const progressFill = document.getElementById('progress-fill');
const feedbackBar = document.getElementById('feedback-bar');
const starRow = document.getElementById('star-row');
const listenHint = document.getElementById('listen-hint');
const comboDisplay = document.getElementById('combo-display');
const qSoundHolder = document.getElementById('q-sound-holder');

// ===== 返回：逐级返回 =====
function handleBack() {
    if (!trainingPage.hidden) { showExercisePage(); return; }
    if (!exercisePage.hidden) { showLevelPage(); return; }
    location.href = '工作台.html#tools';
}
if (wbBack) wbBack.addEventListener('click', handleBack);
if (backBtn) backBtn.addEventListener('click', handleBack);

// 层级卡片点击
document.querySelectorAll('.level-card').forEach(card => {
    card.addEventListener('click', () => {
        currentLevel = card.dataset.level;
        showExercisePage();
    });
});

function showLevelPage() {
    levelPage.hidden = false;
    exercisePage.hidden = true;
    trainingPage.hidden = true;
    if (backBtn) backBtn.hidden = true;
    pageTitle.textContent = '音素意识训练工具';
    refreshLevelProgress();
}

function refreshLevelProgress() {
    const totals = { word: 4, syllable: 4, phoneme: 8 };
    Object.keys(totals).forEach(lv => {
        const card = document.querySelector('.level-card[data-level="' + lv + '"]');
        if (!card) return;
        let done = 0;
        exercises[lv].forEach(ex => { if (progress.done[ex.id]) done++; });
        const pct = Math.round(done / totals[lv] * 100);
        const bar = card.querySelector('.level-progress i');
        if (bar) bar.style.width = pct + '%';
        const st = card.querySelector('.level-stars');
        if (st) st.textContent = '⭐' + countLevelStars(lv);
        card.classList.toggle('unlocked', done >= totals[lv]);
        if (done >= totals[lv]) progress.master[lv] = true;
    });
    saveProgress();
}

function countLevelStars(lv) {
    let s = 0;
    exercises[lv].forEach(ex => { if (progress.done[ex.id]) s++; });
    return s;
}

function showExercisePage() {
    levelPage.hidden = true;
    exercisePage.hidden = false;
    trainingPage.hidden = true;
    if (backBtn) backBtn.hidden = false;
    pageTitle.textContent = levelNames[currentLevel] + ' - 训练项目';

    exerciseList.innerHTML = '';
    exercises[currentLevel].forEach((ex, idx) => {
        const card = document.createElement('div');
        card.className = 'exercise-card' + (progress.done[ex.id] ? ' done' : '');
        card.innerHTML = `
            <div class="exercise-num">训练 ${idx + 1}</div>
            <div class="exercise-title">${ex.title}</div>
            <div class="exercise-desc">${ex.desc}</div>
        `;
        card.addEventListener('click', () => startExercise(ex));
        exerciseList.appendChild(card);
    });
}

// 随机打乱
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

function startExercise(ex) {
    currentExercise = ex;
    const pool = questionBank[ex.id] || [];
    currentQuestions = shuffle(pool).slice(0, PER_ROUND);  // 每轮随机抽 10 题
    currentQuestion = 0;
    score = 0;
    earnedStars = 0;
    combo = 0;
    maxCombo = 0;
    selectedOpt = -1;
    answered = false;

    levelPage.hidden = true;
    exercisePage.hidden = true;
    trainingPage.hidden = false;
    if (backBtn) backBtn.hidden = false;
    pageTitle.textContent = ex.title;
    feedbackBar.className = 'feedback-bar';
    feedbackBar.style.display = 'none';
    comboDisplay.textContent = '';

    showQuestion();
}

// 播放文本（逗号分隔依次播）
function playText(text) {
    if (!text) return;
    if (String(text).indexOf(',') > -1) {
        const parts = String(text).split(',').map(s => s.trim()).filter(Boolean);
        parts.forEach((p, i) => setTimeout(() => playYoudaoSound(p), i * 750));
    } else {
        playYoudaoSound(String(text));
    }
}

function showQuestion() {
    if (currentQuestion >= currentQuestions.length) {
        showTrainingComplete();
        return;
    }
    const q = currentQuestions[currentQuestion];
    selectedOpt = -1;
    answered = false;

    trainingTitle.textContent = '第 ' + (currentQuestion + 1) + ' 题 / 共 ' + currentQuestions.length + ' 题';
    scoreDisplay.textContent = '得分：' + score;
    progressFill.style.width = ((currentQuestion / currentQuestions.length) * 100) + '%';
    feedbackBar.className = 'feedback-bar';
    feedbackBar.style.display = 'none';
    listenHint.style.display = 'flex';
    renderStars(currentQuestion, currentQuestions.length);

    // 题目卡（独立于选项网格）
    qSoundHolder.innerHTML = '';
    const qBox = document.createElement('div');
    qBox.className = 'q-sound';
    qBox.innerHTML = '<button class="q-play-btn" id="q-play-btn" title="播放">🔊</button>' +
        '<span class="q-emoji">' + (q.sound.emoji || '👂') + '</span>' +
        '<span class="q-prompt">' + q.sound.prompt + '</span>';
    qSoundHolder.appendChild(qBox);
    const qPlay = qBox.querySelector('#q-play-btn');
    qPlay.addEventListener('click', () => { sfxClick(); playText(q.sound.text); });

    // 选项网格只放 4 个选项
    optionsGrid.innerHTML = '';
    optionsGrid.className = 'options-grid';
    if (['first-sound', 'middle-sound', 'last-sound'].includes(currentExercise.id)) {
        optionsGrid.classList.add('bubble-mode');
    }
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '<span class="opt-sound-badge">🔊</span>' +
            '<span class="opt-emoji">' + opt.emoji + '</span>' +
            '<span class="opt-cn">' + opt.cn + '</span>';
        btn.addEventListener('click', () => onOptionClick(idx, btn));
        optionsGrid.appendChild(btn);
    });

    // 自动示范发音
    clearTimeout(window._paTimer);
    if (q.sound.text) {
        window._paTimer = setTimeout(() => { playText(q.sound.text); }, 550);
    } else {
        listenHint.textContent = '家长示范发音，孩子听选项选';
    }
}

function renderStars(answered, total) {
    const got = Math.max(0, score > 0 ? Math.ceil(score / 10) : 0);
    let html = '';
    for (let i = 0; i < total; i++) {
        html += '<span class="star' + (i < got ? ' on' : '') + '">⭐</span>';
    }
    starRow.innerHTML = html;
}

// 选项点击：先听后选
function onOptionClick(idx, btn) {
    if (answered) return;
    const q = currentQuestions[currentQuestion];
    const opt = q.options[idx];

    if (selectedOpt === idx) {
        checkAnswer(idx, q.answer, btn);
        return;
    }
    const buttons = optionsGrid.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOpt = idx;
    if (opt.speak !== false) { sfxClick(); playText(opt.text); }
}

function checkAnswer(selected, correct, btn) {
    if (answered) return;
    answered = true;
    const buttons = optionsGrid.querySelectorAll('.option-btn');
    const q = currentQuestions[currentQuestion];
    const isRight = selected === correct;
    const gained = isRight ? (combo >= 2 ? 15 : 10) : 0;

    buttons.forEach((b, i) => {
        b.disabled = true;
        b.classList.remove('selected');
        if (i === correct) b.classList.add('correct');
        if (i === selected && !isRight) b.classList.add('wrong');
    });

    listenHint.style.display = 'none';

    if (isRight) {
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        score += gained;
        earnedStars++;
        scoreDisplay.textContent = '得分：' + score;
        scoreDisplay.classList.remove('bump'); void scoreDisplay.offsetWidth; scoreDisplay.classList.add('bump');
        if (combo >= 3) {
            sfxCombo();
            comboDisplay.textContent = '🔥 连对 ' + combo + ' 题！';
            comboDisplay.classList.remove('big'); void comboDisplay.offsetWidth; comboDisplay.classList.add('big');
            feedbackBar.className = 'feedback-bar show fb-right';
            feedbackBar.innerHTML = '<span class="fb-star">⭐</span> 太棒了！连对 ' + combo + ' 题，+' + gained + ' 分！';
        } else {
            sfxRight();
            comboDisplay.textContent = combo >= 2 ? '✨ 连对 ' + combo + ' 题' : '';
            feedbackBar.className = 'feedback-bar show fb-right';
            feedbackBar.innerHTML = '<span class="fb-star">⭐</span> 太棒了！+' + gained + ' 分';
        }
        setTimeout(() => { if (q.options[correct].speak !== false) playText(q.options[correct].text); }, 350);
        setTimeout(next, 1400);
    } else {
        sfxWrong();
        combo = 0;
        comboDisplay.textContent = '';
        feedbackBar.className = 'feedback-bar show fb-wrong';
        const correctText = q.options[correct].cn;
        feedbackBar.innerHTML = '🤔 再听听看，正确答案是「' + correctText + '」';
        setTimeout(() => { if (q.options[correct].speak !== false) playText(q.options[correct].text); }, 450);
        setTimeout(next, 2300);
    }
}

function next() {
    currentQuestion++;
    showQuestion();
}

// 星星雨
function starRain() {
    try {
        const rain = document.createElement('div');
        rain.className = 'star-rain';
        const emojis = ['⭐', '🌟', '✨', '🎉', '💫'];
        for (let i = 0; i < 24; i++) {
            const s = document.createElement('span');
            s.className = 'rain-star';
            s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            s.style.left = (Math.random() * 96) + '%';
            s.style.animationDuration = (1.4 + Math.random() * 1.6) + 's';
            s.style.animationDelay = (Math.random() * 0.6) + 's';
            s.style.fontSize = (18 + Math.random() * 20) + 'px';
            rain.appendChild(s);
        }
        document.body.appendChild(rain);
        setTimeout(() => rain.remove(), 3800);
    } catch (e) {}
}

function showTrainingComplete() {
    const total = currentQuestions.length;
    const pct = total > 0 ? Math.round(score / (total * 10) * 100) : 0;
    const stars = pct >= 100 ? 3 : pct >= 60 ? 2 : 1;
    progressFill.style.width = '100%';
    scoreDisplay.textContent = '得分：' + score;
    listenHint.style.display = 'none';
    feedbackBar.className = 'feedback-bar';
    feedbackBar.style.display = 'none';

    let starHtml = '';
    for (let i = 0; i < 3; i++) starHtml += '<span class="star' + (i < stars ? ' on' : '') + '">⭐</span>';
    starRow.innerHTML = starHtml;

    // 积分与连击记录
    progress.totalScore += score;
    if (maxCombo > progress.bestCombo) progress.bestCombo = maxCombo;
    progress.done[currentExercise.id] = true;
    saveProgress();

    if (stars === 3) sfxWin();

    trainingTitle.textContent = '训练完成！';
    playSoundBtn.hidden = true;
    optionsGrid.className = 'options-grid';
    optionsGrid.innerHTML = `
        <div class="placeholder" style="grid-column: span 2;">
            <div class="complete-box">
                <div class="complete-emoji">${stars === 3 ? '🏆' : stars === 2 ? '🎉' : '💪'}</div>
                <div class="complete-title">${stars === 3 ? '太厉害了，三颗星！' : stars === 2 ? '很棒，继续加油！' : '完成啦，再来一次拿三颗星！'}</div>
                <div class="star-row" style="margin:0 0 12px;">${starHtml}</div>
                <div class="complete-sub">本场得分 ${score} 分 · 最高连对 ${maxCombo} 题${maxCombo >= 5 ? ' 🔥' : ''} · 累计积分 ${progress.totalScore} 分</div>
                <div class="complete-sub" style="margin-top:4px;">答对 ${Math.round(pct * total / 100)} / ${total} 题 · 已记入进度 ✅</div>
                <div class="complete-actions">
                    <button class="play-sound-btn" onclick="startExercise(currentExercise)" style="margin:0;">🔄 再练一次（重新抽题）</button>
                    <button class="play-sound-btn" onclick="showExercisePage()" style="margin:0;background:var(--green);">📋 返回训练列表</button>
                </div>
            </div>
        </div>
    `;
    if (stars === 3) setTimeout(starRain, 200);
    refreshLevelProgress();
}

// 播放发音（有道美音，失败降级浏览器语音）
function playYoudaoSound(word) {
    if (!word) return;
    const audio = new Audio('https://dict.youdao.com/dictvoice?type=0&audio=' + encodeURIComponent(word));
    audio.play().catch(e => {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }
    });
}

// 手动播放按钮
playSoundBtn.addEventListener('click', () => {
    const q = currentQuestions[currentQuestion];
    if (!q) return;
    sfxClick();
    playText(q.sound.text);
});

// 初始刷新层级进度
refreshLevelProgress();
</script>
